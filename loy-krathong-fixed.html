<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลอยกระทง · Loy Krathong</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Mali:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1030;--card:#141b45;--line:#2a3470;--ink:#fff4dc;--mut:#a9b0d8;--acc:#ffb347;--acc2:#ff7aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 6px}
#scene{display:block;width:100%;height:clamp(320px,54vh,560px);touch-action:manipulation}
main{max-width:760px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#ffb347,#ff7aa8);color:#2a1030;border-color:transparent;font-weight:600}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;gap:14px}

label.t:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{border:2px solid transparent;border-radius:50%;width:34px;height:34px;cursor:pointer;padding:0}

.stage{position:relative}

<h1>🪷 ลอยกระทง 🪷</h1>
<p class="sub">สร้างตัวละคร ตกแต่งกระทง เขียนคำอวยพร แล้วปล่อยลงสายน้ำ</p>
<div class="stage"><canvas id="scene"></canvas><button id="mus">🎵 เปิดเพลง</button><div id="net">กำลังเชื่อมต่อ…</div></div>
<main>
<div class="tabs"><button class="on" data-p="p1">① ตัวละคร</button><button data-p="p2">② กระทง</button><button data-p="p3">③ คำอวยพร</button></div>

<section class="panel on" id="p1">
<canvas class="prev" id="cp" width="170" height="210"></canvas>
<div class="opts">
<label class="t">ชื่อตัวละคร</label><input type="text" id="name" maxlength="16" placeholder="เช่น น้องใบบัว"><label class="t">เพศตัวละคร</label><div class="row" id="gender"></div>
<label class="t">สีผิว</label><div class="row" id="skin"></div>
<label class="t">ทรงผม</label><div class="row" id="hstyle"></div>
<label class="t">สีผม</label><div class="row" id="hair"></div>
<label class="t">สีชุด</label><div class="row" id="cloth"></div>
</div></section>

<section class="panel" id="p2">
<canvas class="prev" id="kp" width="200" height="170"></canvas>
<div class="opts">
<label class="t">ฐานกระทง</label><div class="row" id="base"></div>
<label class="t">สีกลีบดอกไม้</label><div class="row" id="petal"></div>
<label class="t">จำนวนชั้นกลีบ</label><div class="row" id="layers"></div>
<label class="t">สีเทียน</label><div class="row" id="candle"></div>
<label class="t">เครื่องประดับ</label><div class="row" id="extras"></div>
</div></section>

<section class="panel" id="p3"><div class="opts" style="flex-basis:100%">
<label class="t">เขียนคำอวยพรของคุณ</label>
<textarea id="wish" maxlength="90" placeholder="ขอให้มีความสุข สุขภาพแข็งแรง สมหวังในสิ่งที่ปรารถนา..."></textarea>
<div class="cnt"><span id="n">0</span>/90</div>
<div class="row" id="ideas" style="margin-top:6px"></div>
</div></section>

<button id="go">ลอยกระทง ✨</button>
<div id="toast"></div>
<div class="small"><span>แตะที่กระทงเพื่ออ่านคำอวยพร · ในแม่น้ำ <b id="cnt">0</b> ใบ</span><button id="clr">ซ่อนกระทงที่เห็น</button></div><div class="wl"><h2>🌙 คำอวยพรล่าสุดจากทุกคน</h2><div id="wl"></div></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
const $=s=>document.querySelector(s);
const SKIN=['#f6d3b3','#e8b98d','#c98f63','#9a6a45','#6e4730'],HAIR=['#1b1410','#4a2a18','#8a5a2b','#c9a45c','#b8456b'],CLOTH=['#e0457b','#3aa6b9','#7b5cd6','#f08a24','#3fae6a'],PETAL=['#ff7aa8','#ffffff','#c58bff','#ffd23f','#ff9a5c'],BASE=['#4f9a47','#8a5a35','#e9c98a'],CANDLE=['#fff2c4','#ff9aa8','#9ad8ff'];
const o={name:'',gender:'unspecified',skin:SKIN[1],hair:HAIR[0],hstyle:'long',cloth:CLOTH[0],base:0,petal:PETAL[0],layers:3,candle:CANDLE[0],incense:true,marigold:true,sparkle:true};
function sw(id,key,list){const el=$('#'+id);list.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.onclick=()=>{o[key]=c;mark(el,b)};if(o[key]===c)b.classList.add('sel');el.appendChild(b)})}
function chips(id,key,items){const el=$('#'+id);items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{o[key]=v;mark(el,b)};if(o[key]===v)b.classList.add('sel');el.appendChild(b)})}
function mark(el,b){el.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
chips('gender','gender',[['male','ชาย'],['female','หญิง'],['unspecified','ไม่ระบุเพศ']]);
sw('skin','skin',SKIN);sw('hair','hair',HAIR);sw('cloth','cloth',CLOTH);sw('petal','petal',PETAL);sw('candle','candle',CANDLE);
chips('hstyle','hstyle',[['short','ผมสั้น'],['long','ผมยาว'],['bun','มวยผม']]);
chips('base','base',[[0,'ใบตอง'],[1,'กะลา'],[2,'ขนมปัง']]);
chips('layers','layers',[[2,'2 ชั้น'],[3,'3 ชั้น'],[4,'4 ชั้น']]);
[['incense','🪔 ธูป'],['marigold','🌼 ดาวเรือง'],['sparkle','✨ ประกาย']].forEach(([k,l])=>{const b=document.createElement('button');b.className='chip sel';b.textContent=l;b.onclick=()=>{o[k]=!o[k];b.classList.toggle('sel',o[k])};$('#extras').appendChild(b)});
['ขอให้ครอบครัวมีความสุข','ขอให้สุขภาพแข็งแรง','ขอให้สมหวังในรัก','ขอให้การงานก้าวหน้า','ขอบคุณแม่คงคา'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{$('#wish').value=t;$('#n').textContent=t.length};$('#ideas').appendChild(b)});
$('#name').oninput=e=>o.name=e.target.value.trim();
$('#wish').oninput=e=>$('#n').textContent=e.target.value.length;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on')});

/* ---------- drawing ---------- */
function drawK(c,x,y,s,k,t,glow){
 const R=46*s;c.save();c.translate(x,y);
 if(glow){const g=c.createRadialGradient(0,-22*s,0,0,-22*s,R*2.2);g.addColorStop(0,'rgba(255,200,110,.45)');g.addColorStop(1,'rgba(255,200,110,0)');c.fillStyle=g;c.fillRect(-R*2.2,-R*2.4,R*4.4,R*4.4)}
 c.save();c.scale(1,.42);c.fillStyle=BASE[k.base];c.beginPath();c.arc(0,0,R,0,7);c.fill();
 c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=1.5;for(let i=0;i<28;i++){const a=i/28*6.283;c.beginPath();c.moveTo(Math.cos(a)*R*.5,Math.sin(a)*R*.5);c.lineTo(Math.cos(a)*R,Math.sin(a)*R);c.stroke()}
 c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.arc(0,0,R-1,0,7);c.stroke();c.restore();
 if(k.marigold)for(let i=0;i<16;i++){const a=i/16*6.283;c.fillStyle=i%2?'#ffb300':'#ff8f00';c.beginPath();c.arc(Math.cos(a)*R*.98,Math.sin(a)*R*.4-2*s,4.2*s,0,7);c.fill()}
 const y0=-(6+k.layers*7)*s;
 const ps=[];for(let L=0;L<k.layers;L++){const n=9+L*2,r=R*(.86-L*.2);for(let i=0;i<n;i++)ps.push({L,a:i/n*6.283+L*.35,r})}
 ps.sort((p,q)=>(Math.sin(p.a)*p.r*.5+0)-(Math.sin(q.a)*q.r*.5)-(p.L-q.L)*.01);
 ps.sort((p,q)=>p.L-q.L||Math.sin(p.a)-Math.sin(q.a));
 ps.forEach(p=>{const px=Math.cos(p.a)*p.r,py=Math.sin(p.a)*p.r*.42-p.L*8*s;c.save();c.translate(px,py);c.rotate(Math.atan2(Math.sin(p.a)*.55,Math.cos(p.a)));
  const g=c.createLinearGradient(-R*.1,0,R*.4,0);g.addColorStop(0,k.petal);g.addColorStop(1,'rgba(255,255,255,.85)');c.fillStyle=g;c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1;
  c.beginPath();c.ellipse(R*.12,0,R*.27,R*.115,0,0,7);c.fill();c.stroke();c.restore()});
 if(k.incense)[-1,1,0].forEach((d,i)=>{c.strokeStyle='#7a4b24';c.lineWidth=2*s;c.beginPath();c.moveTo(d*9*s,y0+2*s);c.lineTo(d*9*s+d*20*s+(i==2?4*s:0),y0-40*s);c.stroke();c.fillStyle='#ff5a1f';c.beginPath();c.arc(d*9*s+d*20*s+(i==2?4*s:0),y0-40*s,2.2*s,0,7);c.fill()});
 c.fillStyle=k.candle;c.fillRect(-4*s,y0-26*s,8*s,28*s);c.fillStyle='rgba(0,0,0,.12)';c.fillRect(1*s,y0-26*s,3*s,28*s);
 const f=1+.16*Math.sin(t*9+x),fy=y0-34*s;
 const g=c.createRadialGradient(0,fy,0,0,fy,18*s);g.addColorStop(0,'rgba(255,230,150,.9)');g.addColorStop(1,'rgba(255,170,60,0)');c.fillStyle=g;c.fillRect(-20*s,fy-20*s,40*s,40*s);
 c.fillStyle='#ffd34d';c.beginPath();c.ellipse(0,fy,3.4*s*f,7.5*s*f,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.ellipse(0,fy+2*s,1.6*s,3.5*s,0,0,7);c.fill();
 if(k.sparkle)for(let i=0;i<6;i++){const a=i*1.1+t*.4,q=.5+.5*Math.sin(t*3+i*2);const px=Math.cos(a)*R*(.5+.5*((i*37)%10)/10),py=-R*.2-((i*53)%10)*3.5*s;c.fillStyle=`rgba(255,240,180,${q})`;c.save();c.translate(px,py);c.rotate(.785);c.fillRect(-1*s,-4*s*q,2*s,8*s*q);c.fillRect(-4*s*q,-1*s,8*s*q,2*s);c.restore()}
 c.restore()}

function drawChar(c,x,y,s,k,t,label){
 const sk=k.skin;c.save();c.translate(x,y);
 if(k.hstyle==='long'){c.fillStyle=k.hair;c.beginPath();c.ellipse(0,-112*s,25*s,40*s,0,0,7);c.fill()}
 c.fillStyle=k.cloth;c.beginPath();c.moveTo(-17*s,-72*s);c.lineTo(17*s,-72*s);c.lineTo(30*s,0);c.lineTo(-30*s,0);c.fill();
 c.strokeStyle='#ffd27a';c.lineWidth=4*s;c.beginPath();c.moveTo(-30*s,-3*s);c.lineTo(30*s,-3*s);c.stroke();
 c.fillStyle='rgba(255,255,255,.18)';c.fillRect(-3*s,-70*s,6*s,66*s);
 c.fillStyle=k.cloth;c.fillRect(-18*s,-112*s,36*s,42*s);
 c.strokeStyle='#ffd27a';c.lineWidth=8*s;c.beginPath();c.moveTo(-18*s,-110*s);c.lineTo(18*s,-74*s);c.stroke();
 c.strokeStyle='#fff6d0';c.lineWidth=1.6*s;c.beginPath();c.moveTo(-18*s,-110*s);c.lineTo(18*s,-74*s);c.stroke();
 c.strokeStyle=sk;c.lineCap='round';c.lineWidth=8*s;[[-18,-1],[18,1]].forEach(([d,m])=>{c.beginPath();c.moveTo(d*s,-106*s);c.lineTo(d*s+m*4*s,-92*s);c.lineTo(m*14*s,-76*s);c.stroke()});
 c.fillStyle=sk;c.fillRect(-5*s,-122*s,10*s,12*s);
 c.beginPath();c.arc(0,-134*s,20*s,0,7);c.fill();
 c.fillStyle=k.hair;c.beginPath();c.arc(0,-136*s,21*s,3.35,6.07);c.fill();
 if(k.hstyle==='bun'){c.beginPath();c.arc(0,-160*s,10*s,0,7);c.fill()}
 if(k.hstyle==='short'){c.beginPath();c.arc(-17*s,-130*s,6*s,0,7);c.arc(17*s,-130*s,6*s,0,7);c.fill()}
 c.fillStyle='#2a1a14';c.beginPath();c.arc(-7*s,-132*s,2.4*s,0,7);c.arc(7*s,-132*s,2.4*s,0,7);c.fill();
 c.fillStyle='rgba(255,110,130,.35)';c.beginPath();c.arc(-12*s,-126*s,4*s,0,7);c.arc(12*s,-126*s,4*s,0,7);c.fill();
 c.strokeStyle='#8a3a3a';c.lineWidth=1.6*s;c.beginPath();c.arc(0,-127*s,5*s,.2,2.9);c.stroke();
 c.fillStyle='#ffb300';c.beginPath();c.arc(14*s,-148*s,5*s,0,7);c.fill();c.fillStyle='#ff6f00';c.beginPath();c.arc(14*s,-148*s,2*s,0,7);c.fill();
 if(label){c.font=`600 ${Math.max(12,14*s)}px Kanit,sans-serif`;const w=c.measureText(label).width+16;c.fillStyle='rgba(10,16,48,.7)';rr(c,-w/2,-196*s,w,22*s+2,11);c.fill();c.fillStyle='#ffe2a0';c.textAlign='center';c.textBaseline='middle';c.fillText(label,0,-196*s+12*s)}
 c.restore()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---------- scene ---------- */
const cv=$('#scene'),cx=cv.getContext('2d');let W=0,H=0,dpr=1;
function fit(){dpr=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',fit);fit();
[['cp'],['kp']].forEach(([id])=>{const e=$('#'+id),w=e.width,h=e.height;e.style.width=w+'px';e.style.height=h+'px';e.width=w*2;e.height=h*2});
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.52,r:Math.random()*1.4+.3,p:Math.random()*6}));
const lant=Array.from({length:8},()=>({x:Math.random(),y:Math.random(),v:.012+Math.random()*.02,p:Math.random()*6}));
let list=[],sel=null,selUntil=0,last=performance.now(),remote=[],locals=[],hidden=new Set(),db=null,uid=null,canWrite=true;
const pick=(v,a,d)=>a.includes(v)?v:d;
function clean(x){x=x||{};return{name:'',gender:pick(x.gender,['male','female','unspecified'],'unspecified'),skin:pick(x.skin,SKIN,SKIN[1]),hair:pick(x.hair,HAIR,HAIR[0]),hstyle:pick(x.hstyle,['short','long','bun'],'long'),cloth:pick(x.cloth,CLOTH,CLOTH[0]),base:pick(x.base,[0,1,2],0),petal:pick(x.petal,PETAL,PETAL[0]),layers:pick(x.layers,[2,3,4],3),candle:pick(x.candle,CANDLE,CANDLE[0]),incense:!!x.incense,marigold:!!x.marigold,sparkle:!!x.sparkle}}
function hs(q){let h=2166136261;for(const c of q){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967296}
function mk(id,d){d=d||{};const r=hs(id),r2=hs(id+'x');return{id,o:clean(d.o),name:String(d.name||'เพื่อนใหม่').slice(0,16),gender:pick(d.gender,['male','female','unspecified'],'unspecified'),wish:String(d.wish||'').slice(0,90),t:+d.t||Date.now(),spd:9+r*7,lane:.62+r2*.26,ph:r*40,x:0,y:0}}
const rnd=(a,b)=>a+Math.random()*(b-a);

function genderLabel(g){return g==='male'?'ชาย':g==='female'?'หญิง':'ไม่ระบุเพศ'}
function wrap(c,text,max){const out=[];let line='';for(const ch of text){if(c.measureText(line+ch).width>max){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
function bubble(c,x,y,k){c.font='400 13px Kanit,sans-serif';const lines=wrap(c,'“'+k.wish+'”',170),w=190,h=lines.length*18+34;
 x=Math.max(w/2+6,Math.min(W-w/2-6,x));y=Math.max(h+6,y);
 c.fillStyle='rgba(255,246,220,.95)';rr(c,x-w/2,y-h,w,h,14);c.fill();c.beginPath();c.moveTo(x-7,y);c.lineTo(x,y+8);c.lineTo(x+7,y);c.fill();
 c.fillStyle='#2a1030';c.textAlign='center';c.textBaseline='top';c.font='600 12px Kanit,sans-serif';c.fillText('🪷 '+k.name+' · '+genderLabel(k.gender),x,y-h+8);c.font='400 13px Kanit,sans-serif';lines.forEach((l,i)=>c.fillText(l,x,y-h+27+i*18))}

function frame(now){
 const t=now/1000,dt=Math.min(.05,(now-last)/1000);last=now;const c=cx;c.setTransform(dpr,0,0,dpr,0,0);

/*

  2) เพิ่ม Web App แล้วนำ firebaseConfig มาใส่ด้านล่าง

const firebaseConfig = {
  apiKey: "ใส่_API_KEY",
  authDomain: "ใส่_PROJECT_ID.firebaseapp.com",
  projectId: "ใส่_PROJECT_ID",
  appId: "ใส่_APP_ID"
};
(async()=>{
 const net=$('#net');
 try{
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey==='ใส่_API_KEY') throw new Error('ยังไม่ได้ตั้งค่า Firebase');
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth();
  await auth.signInAnonymously();
  uid=auth.currentUser ? auth.currentUser.uid : null;
  db=firebase.firestore();
  db.collection('krathongs').orderBy('t','desc').limit(60).onSnapshot(sn=>{
   remote=sn.docs.map(x=>mk(x.id,x.data()));net.textContent='🌐 แม่น้ำร่วมกัน · ออนไลน์';renderWL();

})();

/* music: original Thai-style pentatonic (7-tone equal tuning) */
let AC,mg,mi=null,mstep=0,mnext=0,mon=false;
const pen=i=>[0,1,3,4,5][((i%5)+5)%5]+Math.floor(i/5)*7,fq=d=>196*Math.pow(2,d/7);
const MA=[5,6,7,6,5,3,4,null,3,4,5,3,2,3,1,null],MB=[7,8,9,8,7,6,5,null,6,5,3,4,3,2,1,0],SEQ=[MA,MA,MB,MA];
function ensureAC(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=0;const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();dl.delayTime.value=.38;fb.gain.value=.38;lp.frequency.value=2200;
 mg.connect(AC.destination);mg.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AC.destination);
 [fq(-5),fq(-1),fq(2)].forEach(f=>{const oc=AC.createOscillator(),g=AC.createGain();oc.type='sine';oc.frequency.value=f;g.gain.value=.035;oc.connect(g);g.connect(mg);oc.start()})}
function pluck(f,t,v,dur){const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o1.type='triangle';o2.type='sine';o1.frequency.value=f;o2.frequency.value=f*2.01;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o1.connect(g);o2.connect(g);g.connect(mg);o1.start(t);o2.start(t);o1.stop(t+dur+.05);o2.stop(t+dur+.05)}
function sched(){mnext=Math.max(mnext,AC.currentTime);while(mnext<AC.currentTime+.35){const n=SEQ[Math.floor(mstep/16)%4][mstep%16];
 if(n!=null)pluck(fq(pen(n)),mnext,.22,1.6);if(mstep%8===0)pluck(fq(pen(mstep%16?-2:-5)),mnext,.2,2.6);if(mstep%4===2&&n!=null)pluck(fq(pen(n+5)),mnext+.18,.07,1);mnext+=.4;mstep++}}
$('#mus').onclick=()=>{ensureAC();mon=!mon;const t=AC.currentTime;mg.gain.cancelScheduledValues(t);
 if(mon){AC.resume();mnext=t+.1;clearInterval(mi);mi=setInterval(sched,120);mg.gain.setValueAtTime(mg.gain.value,t);mg.gain.linearRampToValueAtTime(.7,t+1.5)}
 else{clearInterval(mi);mg.gain.setValueAtTime(mg.gain.value,t);mg.gain.linearRampToValueAtTime(0,t+.5)}
 $('#mus').textContent=mon?'🔇 ปิดเพลง':'🎵 เปิดเพลง'};
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(mon)AC.resume()});
function sfx(){if(!AC||!mon)return;const t=AC.currentTime,oc=AC.createOscillator(),g=AC.createGain();oc.frequency.setValueAtTime(700,t);oc.frequency.exponentialRampToValueAtTime(180,t+.18);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);oc.connect(g);g.connect(mg);oc.start(t);oc.stop(t+.3);pluck(fq(pen(11)),t+.15,.15,2)}
