<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลอยกระทง · Loy Krathong</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Mali:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1030;--card:#141b45;--line:#2a3470;--ink:#fff4dc;--mut:#a9b0d8;--acc:#ffb347;--acc2:#ff7aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit','Sarabun',sans-serif}
h1{margin:0;font-family:'Mali','Kanit',sans-serif;font-size:clamp(22px,5vw,34px);text-align:center;padding:10px 12px 2px;background:linear-gradient(90deg,#ffd27a,#ff9ac2);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 6px}
#scene{display:block;width:100%;height:clamp(320px,54vh,560px);touch-action:manipulation;background:linear-gradient(180deg,#080f32 0%,#25245e 55%,#090f30 100%)}
main{max-width:760px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#ffb347,#ff7aa8);color:#2a1030;border-color:transparent;font-weight:600}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;gap:14px}
.panel.on{display:flex;flex-wrap:wrap}
.prev{flex:0 0 auto;margin:0 auto;border-radius:14px;background:radial-gradient(circle at 50% 30%,#26327a,#0d1340)}
.opts{flex:1 1 220px;min-width:0}
label.t{display:block;font-size:13px;color:var(--mut);margin:10px 0 5px}
label.t:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{border:2px solid transparent;border-radius:50%;width:34px;height:34px;cursor:pointer;padding:0}
.row button.chip{width:auto;height:auto;border-radius:999px;padding:6px 12px;background:#1e2860;color:var(--ink);font:inherit;font-size:13px;border:2px solid transparent}
.row button.sel{border-color:#fff;box-shadow:0 0 10px #ffd27a}
input[type=text],textarea{width:100%;background:#0d1340;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:16px}
textarea{resize:none;height:110px}
.hint{font-size:12px;color:var(--mut);line-height:1.5;margin-top:6px}
.cnt{font-size:12px;color:var(--mut);text-align:right}
#go{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:16px;font:600 18px 'Kanit',sans-serif;color:#2a1030;background:linear-gradient(135deg,#ffd27a,#ff8fb8);box-shadow:0 6px 24px #ff8fb855;cursor:pointer}
#go:active{transform:scale(.98)}
#toast{text-align:center;color:#ffd27a;min-height:22px;margin-top:8px;font-size:14px}
.small{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin-top:6px}
.small button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:5px 10px;font:inherit;cursor:pointer}
.stage{position:relative}
#mus{position:absolute;left:10px;top:10px;background:rgba(10,16,48,.65);color:#ffe2a0;border:1px solid #ffe2a066;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
#net{position:absolute;right:10px;top:10px;background:rgba(10,16,48,.65);color:#c9d0f5;border-radius:999px;padding:6px 12px;font-size:12px}
.wl{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.wl h2{margin:0 0 8px;font-size:16px;color:#ffd27a}
.wi{border-top:1px solid var(--line);padding:8px 0;font-size:14px;cursor:pointer}
.wi b{color:#ffb8d0;font-weight:600}.wi span{display:block}
#reader{display:none;margin-bottom:10px;background:linear-gradient(135deg,#2a2060,#141b45);border:1px solid #ffd27a66;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.55}#reader.on{display:block}#reader b{color:#ffd27a}#reader small{color:var(--mut);display:block;margin-bottom:4px}
</style></head><body>
<h1>🪷 ลอยกระทง 🪷</h1>
<p class="sub">สร้างตัวละคร ตกแต่งกระทง เขียนคำอวยพร แล้วปล่อยลงสายน้ำ</p>
<div class="stage"><canvas id="scene"></canvas><button id="mus">🎵 เปิดเพลง</button><div id="net">กำลังเชื่อมต่อ…</div></div>
<main>
<div id="reader"></div><div class="tabs"><button class="on" data-p="p1">① ตัวละคร</button><button data-p="p2">② กระทง</button><button data-p="p3">③ คำอวยพร</button></div>

<section class="panel on" id="p1">
<canvas class="prev" id="cp" width="170" height="210"></canvas>
<div class="opts">
<label class="t">ชื่อตัวละคร</label><input type="text" id="name" maxlength="16" placeholder="เช่น น้องใบบัว"><label class="t">เพศตัวละคร</label><div class="row" id="gender"></div>
<label class="t">สีผิว</label><div class="row" id="skin"></div>
<label class="t">ทรงผม</label><div class="row" id="hstyle"></div>
<label class="t">สีผม</label><div class="row" id="hair"></div>
<label class="t">รูปแบบเสื้อผ้า</label><div class="row" id="outfit"></div><label class="t">สีชุด</label><div class="row" id="cloth"></div>
</div></section>

<section class="panel" id="p2">
<canvas class="prev" id="kp" width="200" height="170"></canvas>
<div class="opts">
<label class="t">ทรงกระทง</label><div class="row" id="style"></div><label class="t">ฐานกระทง</label><div class="row" id="base"></div>
<label class="t">สีกลีบดอกไม้</label><div class="row" id="petal"></div>
<label class="t">จำนวนชั้นกลีบ</label><div class="row" id="layers"></div>
<label class="t">สีเทียน</label><div class="row" id="candle"></div>
<label class="t">เครื่องประดับ</label><div class="row" id="extras"></div>
</div></section>

<section class="panel" id="p3"><div class="opts" style="flex-basis:100%">
<label class="t">เขียนคำอวยพรของคุณ</label>
<textarea id="wish" maxlength="90" placeholder="ขอให้มีความสุข สุขภาพแข็งแรง สมหวังในสิ่งที่ปรารถนา..."></textarea>
<div class="cnt"><span id="n">0</span>/90</div>
<div class="row" id="ideas" style="margin-top:6px"></div>
</div></section>

<button id="go">ลอยกระทง ✨</button>
<div id="toast"></div>
<div class="small"><span>แตะที่กระทงเพื่ออ่านคำอวยพร · ในแม่น้ำ <b id="cnt">0</b> ใบ</span><button id="clr">ซ่อนกระทงที่เห็น</button></div><div class="wl"><h2>🌙 คำอวยพรล่าสุดจากทุกคน</h2><div id="wl"></div></div>
</main>

<script>
const $=s=>document.querySelector(s);
const SKIN=['#f6d3b3','#e8b98d','#c98f63','#9a6a45','#6e4730'],HAIR=['#1b1410','#4a2a18','#8a5a2b','#c9a45c','#b8456b'],CLOTH=['#e0457b','#3aa6b9','#7b5cd6','#f08a24','#3fae6a'],PETAL=['#ff7aa8','#ffffff','#c58bff','#ffd23f','#ff9a5c'],BASE=['#4f9a47','#8a5a35','#e9c98a'],CANDLE=['#fff2c4','#ff9aa8','#9ad8ff'];
const o={name:'',gender:'female',skin:SKIN[1],hair:HAIR[0],hstyle:'long',outfit:'f-sabai',cloth:CLOTH[0],style:'lotus',base:0,petal:PETAL[0],layers:3,candle:CANDLE[0],incense:true,marigold:true,sparkle:true};
function sw(id,key,list){const el=$('#'+id);list.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.onclick=()=>{o[key]=c;mark(el,b)};if(o[key]===c)b.classList.add('sel');el.appendChild(b)})}
const OUT={male:[['m-raja','ชุดไทยราชประแตน'],['m-mohom','หม้อห้อมชาวบ้าน'],['m-street','สตรีตแวร์ (แจ็กเก็ต)']],female:[['f-sabai','ชุดไทยสไบเฉียง'],['f-chut','ลูกไม้+ซิ่นไทย'],['f-dress','เดรสผ้าไทยประยุกต์']],unspecified:[['n-tee','เสื้อยืด+กางเกง'],['n-robe','เสื้อคลุมผ้าไทย']]};
const HST={male:[['short','ผมสั้น'],['side','แสกข้าง'],['bun','มวยผม']],female:[['long','ผมยาว'],['bun','มวยผม'],['braid','ถักเปีย']],unspecified:[['short','ผมสั้น'],['long','ผมยาว'],['bun','มวยผม']]};
function chips(id,key,items){const el=$('#'+id);items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{o[key]=v;mark(el,b);if(id==='gender'){o.hstyle='';o.outfit='';buildOpts()}};if(o[key]===v)b.classList.add('sel');el.appendChild(b)})}
function buildOpts(){const g=o.gender;if(!OUT[g].some(a=>a[0]===o.outfit))o.outfit=OUT[g][0][0];if(!HST[g].some(a=>a[0]===o.hstyle))o.hstyle=HST[g][0][0];$('#outfit').textContent='';$('#hstyle').textContent='';chips('outfit','outfit',OUT[g]);chips('hstyle','hstyle',HST[g])}
function mark(el,b){el.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
chips('gender','gender',[['male','♂ ชาย'],['female','♀ หญิง'],['unspecified','ไม่ระบุเพศ']]);
sw('skin','skin',SKIN);sw('hair','hair',HAIR);sw('cloth','cloth',CLOTH);sw('petal','petal',PETAL);sw('candle','candle',CANDLE);buildOpts();

chips('base','base',[[0,'ใบตอง'],[1,'กะลา'],[2,'ขนมปัง']]);
chips('layers','layers',[[2,'2 ชั้น'],[3,'3 ชั้น'],[4,'4 ชั้น']]);chips('style','style',[['lotus','🪷 ดอกบัว'],['marigold','🌼 ดาวเรือง'],['star','⭐ ใบตองพับดาว'],['heart','💗 หัวใจ']]);
[['incense','🪔 ธูป'],['marigold','🌼 ดาวเรือง'],['sparkle','✨ ประกาย']].forEach(([k,l])=>{const b=document.createElement('button');b.className='chip sel';b.textContent=l;b.onclick=()=>{o[k]=!o[k];b.classList.toggle('sel',o[k])};$('#extras').appendChild(b)});
['ขอให้ครอบครัวมีความสุข','ขอให้สุขภาพแข็งแรง','ขอให้สมหวังในรัก','ขอให้การงานก้าวหน้า','ขอบคุณแม่คงคา'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{$('#wish').value=t;$('#n').textContent=t.length};$('#ideas').appendChild(b)});
$('#name').oninput=e=>o.name=e.target.value.trim();
$('#wish').oninput=e=>$('#n').textContent=e.target.value.length;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on')});

/* ---------- drawing ---------- */
function drawK(c,x,y,s,k,t,glow){
 const R=46*s;c.save();c.translate(x,y);
 if(glow){const g=c.createRadialGradient(0,-22*s,0,0,-22*s,R*2.2);g.addColorStop(0,'rgba(255,200,110,.45)');g.addColorStop(1,'rgba(255,200,110,0)');c.fillStyle=g;c.fillRect(-R*2.2,-R*2.4,R*4.4,R*4.4)}
 const st=k.style||'lotus',GD='#ffb300',sq=.42;
 const y0=-({lotus:6+k.layers*7,marigold:10+k.layers*8,star:8+k.layers*7,heart:8+k.layers*7}[st]||20)*s;
 const star=(r1,r2,n,rot)=>{c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,r=i%2?r2:r1;i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath()};
 const hp=a=>[16*Math.pow(Math.sin(a),3),-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))];
 const heartP=sc=>{c.beginPath();for(let i=0;i<=40;i++){const q=hp(i/40*6.2832);i?c.lineTo(q[0]*sc,q[1]*sc):c.moveTo(q[0]*sc,q[1]*sc)}c.closePath()};
 if(st==='lotus'){c.save();c.scale(1,.42);c.fillStyle=BASE[k.base];c.beginPath();c.arc(0,0,R,0,7);c.fill();
 c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=1.5;for(let i=0;i<28;i++){const a=i/28*6.283;c.beginPath();c.moveTo(Math.cos(a)*R*.5,Math.sin(a)*R*.5);c.lineTo(Math.cos(a)*R,Math.sin(a)*R);c.stroke()}
 c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.arc(0,0,R-1,0,7);c.stroke();
 // Raised braided rim and banana-leaf segments around the base.
 c.strokeStyle=k.base===0?'#a8d77b':k.base===1?'#b98752':'#e8c58c';c.lineWidth=3*s;
 c.beginPath();c.ellipse(0,0,R*.94,R*.39,0,0,Math.PI*2);c.stroke();
 for(let i=0;i<24;i++){const a=i/24*Math.PI*2;c.strokeStyle=i%2?'rgba(255,245,190,.65)':'rgba(35,90,45,.55)';c.lineWidth=1.2*s;c.beginPath();c.moveTo(Math.cos(a)*R*.78,Math.sin(a)*R*.31);c.lineTo(Math.cos(a)*R*.98,Math.sin(a)*R*.39);c.stroke()}
 c.restore();
 if(k.marigold)for(let i=0;i<16;i++){const a=i/16*6.283;c.fillStyle=i%2?'#ffb300':'#ff8f00';c.beginPath();c.arc(Math.cos(a)*R*.98,Math.sin(a)*R*.4-2*s,4.2*s,0,7);c.fill()}
  const ps=[];for(let L=0;L<k.layers;L++){const n=9+L*2,r=R*(.86-L*.2);for(let i=0;i<n;i++)ps.push({L,a:i/n*6.283+L*.35,r})}
 ps.sort((p,q)=>(Math.sin(p.a)*p.r*.5+0)-(Math.sin(q.a)*q.r*.5)-(p.L-q.L)*.01);
 ps.sort((p,q)=>p.L-q.L||Math.sin(p.a)-Math.sin(q.a));
 ps.forEach(p=>{const px=Math.cos(p.a)*p.r,py=Math.sin(p.a)*p.r*.42-p.L*8*s;c.save();c.translate(px,py);c.rotate(Math.atan2(Math.sin(p.a)*.55,Math.cos(p.a)));
  const g=c.createLinearGradient(-R*.1,0,R*.4,0);g.addColorStop(0,k.petal);g.addColorStop(1,'rgba(255,255,255,.85)');c.fillStyle=g;c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1;
  c.beginPath();c.ellipse(R*.12,0,R*.27,R*.115,0,0,7);c.fill();c.stroke();
  // Fine central vein and two side veins on every petal.
  c.strokeStyle='rgba(120,95,45,.38)';c.lineWidth=.8*s;c.beginPath();c.moveTo(-R*.08,0);c.lineTo(R*.34,0);c.moveTo(R*.02,-R*.045);c.lineTo(R*.19,-R*.085);c.moveTo(R*.02,R*.045);c.lineTo(R*.19,R*.085);c.stroke();
  c.restore()});
 // Small flower center makes the layered petals read as a real floral arrangement.
 c.fillStyle='#f6b934';c.beginPath();c.arc(0,-(6+k.layers*7)*s,5*s,0,Math.PI*2);c.fill();
 c.fillStyle='#fff0a8';c.beginPath();c.arc(-1.5*s,-(8+k.layers*7)*s,1.5*s,0,Math.PI*2);c.fill();
 }
 else if(st==='marigold'){
  c.save();c.scale(1,sq);c.fillStyle=BASE[k.base];c.beginPath();c.arc(0,0,R,0,7);c.fill();c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1.5;for(let i=0;i<24;i++){const a=i/24*6.283;c.beginPath();c.moveTo(Math.cos(a)*R*.6,Math.sin(a)*R*.6);c.lineTo(Math.cos(a)*R,Math.sin(a)*R);c.stroke()}c.restore();
  const bl=[];for(let L=0;L<k.layers;L++){const n=15-L*3,r=R*(.82-L*.22);for(let i=0;i<n;i++)bl.push({L,a:i/n*6.283+L*.4,r})}
  bl.sort((p,q)=>p.L-q.L||Math.sin(p.a)-Math.sin(q.a));
  bl.forEach(p=>{const px=Math.cos(p.a)*p.r,py=Math.sin(p.a)*p.r*sq-p.L*9*s-4*s,b=(8-p.L*.9)*s;
   for(let j=0;j<9;j++){const a=j*.698;c.fillStyle=k.petal;c.beginPath();c.arc(px+Math.cos(a)*b*.62,py+Math.sin(a)*b*.5,b*.5,0,7);c.fill();if(j%2){c.fillStyle='rgba(255,255,255,.35)';c.fill()}}
   c.fillStyle=GD;c.beginPath();c.arc(px,py,b*.38,0,7);c.fill()})}
 else if(st==='star'){
  for(let L=0;L<k.layers;L++){const r=R*(1.02-L*.26),col=L===0?BASE[k.base]:(L%2?k.petal:'#fff6e0');
   c.save();c.translate(0,-L*7*s);c.scale(1,sq);star(r,r*.56,8,L*.39);c.fillStyle=col;c.fill();c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1.4;c.stroke();
   for(let i=0;i<8;i++){const a=L*.39+i*Math.PI/4,a2=a+Math.PI/8;c.fillStyle='rgba(0,0,0,.16)';c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.lineTo(Math.cos(a2)*r*.56,Math.sin(a2)*r*.56);c.closePath();c.fill()}
   c.restore()}
  if(k.marigold)for(let i=0;i<8;i++){const a=i*Math.PI/4+.39;c.fillStyle=GD;c.beginPath();c.arc(Math.cos(a)*R*.66,Math.sin(a)*R*.66*sq,3.6*s,0,7);c.fill()}}
 else if(st==='heart'){const sc=R/16;
  c.save();c.scale(1,sq);heartP(sc*1.04);c.fillStyle=BASE[k.base];c.fill();c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=2;c.stroke();c.restore();
  for(let L=0;L<k.layers;L++){const f=.86-L*.2;c.save();c.translate(0,-L*7*s);c.scale(1,sq);heartP(sc*f);const g=c.createLinearGradient(-R,-R*.6,R,R*.6);g.addColorStop(0,L%2?'#fff':k.petal);g.addColorStop(1,L%2?k.petal:'#fff');c.fillStyle=g;c.fill();c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1.2;c.stroke();c.restore()}
  if(k.marigold)for(let i=0;i<14;i++){const q=hp(i/14*6.283);c.fillStyle=GD;c.beginPath();c.arc(q[0]*sc*1.04,q[1]*sc*1.04*sq,3.2*s,0,7);c.fill()}}
 if(k.incense)[-1,1,0].forEach((d,i)=>{c.strokeStyle='#7a4b24';c.lineWidth=2*s;c.beginPath();c.moveTo(d*9*s,y0+2*s);c.lineTo(d*9*s+d*20*s+(i==2?4*s:0),y0-40*s);c.stroke();c.fillStyle='#ff5a1f';c.beginPath();c.arc(d*9*s+d*20*s+(i==2?4*s:0),y0-40*s,2.2*s,0,7);c.fill()});
 c.fillStyle=k.candle;c.fillRect(-4*s,y0-26*s,8*s,28*s);c.fillStyle='rgba(0,0,0,.12)';c.fillRect(1*s,y0-26*s,3*s,28*s);
 const f=1+.16*Math.sin(t*9+x),fy=y0-34*s;

/* music: original Thai-style pentatonic (7-tone equal tuning) */
let AC,mg,mi=null,mstep=0,mnext=0,mon=false;
const pen=i=>[0,1,3,4,5][((i%5)+5)%5]+Math.floor(i/5)*7,fq=d=>196*Math.pow(2,d/7);
const MA=[5,6,7,6,5,3,4,null,3,4,5,3,2,3,1,null],MB=[7,8,9,8,7,6,5,null,6,5,3,4,3,2,1,0],SEQ=[MA,MA,MB,MA];
function ensureAC(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=0;const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();dl.delayTime.value=.38;fb.gain.value=.38;lp.frequency.value=2200;
 mg.connect(AC.destination);mg.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AC.destination);
 [fq(-5),fq(-1),fq(2)].forEach(f=>{const oc=AC.createOscillator(),g=AC.createGain();oc.type='sine';oc.frequency.value=f;g.gain.value=.035;oc.connect(g);g.connect(mg);oc.start()})}
function pluck(f,t,v,dur){const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o1.type='triangle';o2.type='sine';o1.frequency.value=f;o2.frequency.value=f*2.01;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o1.connect(g);o2.connect(g);g.connect(mg);o1.start(t);o2.start(t);o1.stop(t+dur+.05);o2.stop(t+dur+.05)}
function sched(){mnext=Math.max(mnext,AC.currentTime);while(mnext<AC.currentTime+.35){const n=SEQ[Math.floor(mstep/16)%4][mstep%16];
 if(n!=null)pluck(fq(pen(n)),mnext,.22,1.6);if(mstep%8===0)pluck(fq(pen(mstep%16?-2:-5)),mnext,.2,2.6);if(mstep%4===2&&n!=null)pluck(fq(pen(n+5)),mnext+.18,.07,1);mnext+=.4;mstep++}}
$('#mus').onclick=()=>{ensureAC();mon=!mon;const t=AC.currentTime;mg.gain.cancelScheduledValues(t);
 if(mon){AC.resume();mnext=t+.1;clearInterval(mi);mi=setInterval(sched,120);mg.gain.setValueAtTime(mg.gain.value,t);mg.gain.linearRampToValueAtTime(.7,t+1.5)}
 else{clearInterval(mi);mg.gain.setValueAtTime(mg.gain.value,t);mg.gain.linearRampToValueAtTime(0,t+.5)}
 $('#mus').textContent=mon?'🔇 ปิดเพลง':'🎵 เปิดเพลง'};
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(mon)AC.resume()});
function sfx(){if(!AC||!mon)return;const t=AC.currentTime,oc=AC.createOscillator(),g=AC.createGain();oc.frequency.setValueAtTime(700,t);oc.frequency.exponentialRampToValueAtTime(180,t+.18);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);oc.connect(g);g.connect(mg);oc.start(t);oc.stop(t+.3);pluck(fq(pen(11)),t+.15,.15,2)}
/*
  Firestore Security Rules (วางใน Firebase Console > Firestore Database > Rules):
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      match /krathongs/{krathongId} {
        allow read: if true;
        allow create: if request.auth != null
          && request.resource.data.uid == request.auth.uid
          && request.resource.data.wish is string
          && request.resource.data.wish.size() <= 90
          && request.resource.data.name is string
          && request.resource.data.name.size() <= 16
          && request.resource.data.gender in ['male', 'female', 'unspecified']
          && request.resource.data.t is number;
        allow update, delete: if false;
      }
    }
  }
  หมายเหตุ: Rules นี้อนุญาตให้อ่านคำอวยพรได้สาธารณะ และให้ผู้ใช้ที่ล็อกอินแบบไม่ระบุตัวตนสร้างข้อมูลใหม่ได้
  ไม่ควรใส่ชื่อจริง เบอร์โทร ที่อยู่ หรือข้อมูลส่วนตัวในคำอวยพร
  เมื่อใส่ Firebase config และตั้งค่า Anonymous Auth + Firestore Rules แล้ว ทุกคนจะเห็นแม่น้ำและคำอวยพรชุดเดียวกัน
*/
